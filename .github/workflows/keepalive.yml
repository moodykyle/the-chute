name: keepalive

on:
  schedule:
    - cron: "14 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query heartbeat
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=beat_at&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          cat /tmp/out
          if [ "$code" = "503" ]; then
            echo "::warning::Project was paused, this request should resume it"
            exit 0
          fi
          [ "$code" = "200" ] || exit 1
